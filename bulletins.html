        <div class="page-header">

        <!--<div class="section-b">

        <!-- BULLETINS START -->
        <div id="starter"></div>
        
        <!-- BULLETINS END -->

        <!-- TEMPLATE:
        <div class="section-b">
            <h2>Test Headline</h2>
            <p>Test description.</p>
        </div>
        -->
        <script>
            async function getBullitens() {
                const url = "https://zuni.apatheticdell.net/api/collections/apd_bulletins/records";
                
                try {
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) { throw new Error(`Response status: ${response.status}`); }

                    const bulletins_json = await response.json();
                    
                    console.log(bulletins_json);

                    return(bulletins_json);

                } catch (error) { console.error(error.message); return null; }
            }

            function addElement(content) {
                const sectionBulletin = document.createElement("div");
                const headlineElement = document.createElement("h2");
                var descriptionElement = document.createElement("div");

                const headline = document.createTextNode(content.headline);

                // const description = document.createTextNode(content.description);
                // descriptionElement.appendChild(description);
                
                headlineElement.appendChild(headline);
                descriptionElement.innerHTML = content.description;

                const level = content.level;
                if (level == "warning") {
                    sectionBulletin.className = "section-c";
                } else {
                    sectionBulletin.className = "section-b";
                }
                
                sectionBulletin.appendChild(headlineElement);
                sectionBulletin.appendChild(descriptionElement);

                const starterElement = document.getElementById("starter");

                document.body.insertBefore(sectionBulletin, starterElement)
            }

            function setNoActive() {
                const noBulletinsElement = document.createElement("div");
                noBulletinsElement.className = "section-b";
                noBulletinsElement.innerHTML = "<p>No active bulletins.";
                const starterElement = document.getElementById("starter");
                document.body.insertBefore(noBulletinsElement, starterElement)
            }

            async function processBullitens() {
                const bulletins_json = await getBullitens();

                if (bulletins_json == null) {
                    setNoActive()
                } else {
                    var bulletins_list = bulletins_json.items

                    if (bulletins_list.length == 0) { setNoActive(); }

                    for(var i = 0, size = bulletins_list.length; i < size ; i++){
                    var item = bulletins_list[i]; addElement(item); }
                }                
            }
            
            processBullitens();
        </script>
